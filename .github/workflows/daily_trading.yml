name: Daily Trading Bot

on:
  schedule:
    # Daily sync: Mon–Fri 06:35 UTC = 9:35 AM Israel (summer UTC+3) / 8:35 AM (winter UTC+2)
    - cron: "35 6 * * 1-5"
    # Execute signals: Mon–Fri 13:30 UTC = 4:30 PM Israel (summer) / 3:30 PM (winter) ≈ US market open
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which step to run"
        required: true
        default: "sync"
        type: choice
        options:
          - sync
          - execute
          - both

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  IB_ACCOUNT_ID: ${{ secrets.IB_ACCOUNT_ID }}

jobs:
  # ── After-close: download data, reconcile, generate signals ──
  daily-sync:
    if: >
      github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'sync' || github.event.inputs.mode == 'both')
      || (github.event_name == 'schedule' && github.event.schedule == '35 6 * * 1-5')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      ib-gateway:
        image: ghcr.io/gnzsnz/ib-gateway:latest
        ports:
          - 4002:4002
        env:
          TWS_USERID: ${{ secrets.IB_USER }}
          TWS_PASSWORD: ${{ secrets.IB_PASSWORD }}
          TRADING_MODE: paper
          TWS_ACCEPT_INCOMING: "accept"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install TA-Lib C library
        run: |
          sudo apt-get update
          sudo apt-get install -y wget build-essential
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Wait for IB Gateway to be ready
        run: |
          echo "Waiting for IB Gateway on port 4002..."
          for i in $(seq 1 30); do
            if nc -z localhost 4002 2>/dev/null; then
              echo "IB Gateway port is open — waiting 15s for auth handshake..."
              sleep 15
              echo "IB Gateway is ready!"
              exit 0
            fi
            echo "  attempt $i/30 — not ready yet"
            sleep 5
          done
          echo "IB Gateway did not start in time."
          exit 1

      - name: Verify IB Gateway connection
        env:
          IB_HOST: "127.0.0.1"
          IB_PORT: "4002"
        run: python scripts/check_ib_connection.py --host 127.0.0.1 --port 4002 --timeout 20

      - name: Run daily sync (reconcile + signals)
        env:
          IB_HOST: "127.0.0.1"
          IB_PORT: "4002"
          IB_CLIENT_ID: "1"
        run: python daily_sync.py

      - name: Database maintenance (prune old market data)
        run: python db_maintenance.py

  # ── Market-open: execute pending signals ──
  execute-signals:
    if: >
      github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'execute' || github.event.inputs.mode == 'both')
      || (github.event_name == 'schedule' && github.event.schedule == '30 13 * * 1-5')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      ib-gateway:
        image: ghcr.io/gnzsnz/ib-gateway:latest
        ports:
          - 4002:4002
        env:
          TWS_USERID: ${{ secrets.IB_USER }}
          TWS_PASSWORD: ${{ secrets.IB_PASSWORD }}
          TRADING_MODE: paper
          TWS_ACCEPT_INCOMING: "accept"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Wait for IB Gateway to be ready
        run: |
          echo "Waiting for IB Gateway on port 4002..."
          for i in $(seq 1 30); do
            if nc -z localhost 4002 2>/dev/null; then
              echo "IB Gateway port is open — waiting 15s for auth handshake..."
              sleep 15
              echo "IB Gateway is ready!"
              exit 0
            fi
            echo "  attempt $i/30 — not ready yet"
            sleep 5
          done
          echo "IB Gateway did not start in time."
          exit 1

      - name: Verify IB Gateway connection
        env:
          IB_HOST: "127.0.0.1"
          IB_PORT: "4002"
        run: python scripts/check_ib_connection.py --host 127.0.0.1 --port 4002 --timeout 20

      - name: Execute pending signals
        env:
          IB_HOST: "127.0.0.1"
          IB_PORT: "4002"
          IB_CLIENT_ID: "1"
        run: python execute_signals.py
